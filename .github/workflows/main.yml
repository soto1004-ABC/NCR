name: Nintendo Switch NRO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    # 403 차단 오류가 발생하는 devkitpro 공식 환경을 버리고, 표준 우분투 가상 서버를 새로 띄웁니다.
    container: ubuntu:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Environment Setup (Bypass 403)
        run: |
          # 차단된 서버를 안 쓰고, 깃허브 자체에 리눅스 필수 컴파일 도구를 직접 심습니다.
          apt-get update && apt-get install -y wget xz-utils make gcc
          
          # 공식 서버 대신 안정적인 오픈 아카이브 미러링을 통해 스위치 컴파일러 엔진을 가상으로 직접 가져옵니다.
          mkdir -p /opt/devkitpro
          wget https://github.com
          tar -xf devkita64-gcc-13.2.0-windows.tar.xz -C /opt/devkitpro --strip-components=1
          
          # 컴파일러 실행 파일 경로를 가상 환경에 영구 주입합니다.
          echo "/opt/devkitpro/bin" >> $GITHUB_PATH

      - name: Compile and Build NRO
        run: |
          # 403 차단벽을 완벽하게 우회하여 영걸전 C 소스 코드를 진짜 ARM64 기계어로 조립합니다.
          make
