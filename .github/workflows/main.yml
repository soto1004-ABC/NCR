name: Nintendo Switch NRO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    # 깃허브가 제공하는 가장 표준적이고 안전한 최신 공식 컴파일러 컨테이너입니다.
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Switch Portlibs
        run: |
          # 403 차단 오류 및 라이브러리 충돌을 원천 회피하기 위해, 
          # 시스템 강제 업데이트(Syu)를 빼고 순수하게 영걸전에 필요한 핵심 부품만 다이렉트로 안전하게 심습니다.
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-sdl2_mixer switch-lua53

      - name: Compile and Build NRO
        run: |
          # 깃허브 가상 컴퓨터가 내 소스코드를 진짜 스위치 기계어로 직접 링킹 및 컴파일합니다.
          make
