name: Nintendo Switch NRO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Environment Setup (Perfect Bypass)
        run: |
          # 1. 리눅스 패키지 시스템을 안정적으로 업데이트하고 필수 빌드 툴을 설치합니다.
          apt-get update && apt-get install -y wget xz-utils make gcc ca-certificates
          
          # 2. 보안 인증 문제를 원천 차단하고 미러링 저장소에서 스위치 전용 컴파일러를 강제 주입합니다.
          mkdir -p /opt/devkitpro
          wget --no-check-certificate https://github.com
          tar -xf devkita64-gcc-13.2.0-windows.tar.xz -C /opt/devkitpro --strip-components=1
          
          # 3. 환경 변수를 깃허브 가상 메모리에 완전 안착시킵니다.
          echo "/opt/devkitpro/bin" >> $GITHUB_PATH

      - name: Compile and Build NRO
        run: |
          # 내 영걸전 C 코드를 진짜 스위치 기계어로 완벽하게 링킹합니다.
          make
