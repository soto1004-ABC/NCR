name: Nintendo Switch NRO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Switch Portlibs
        run: |
          dkp-pacman -Syu --noconfirm && \
          dkp-pacman -S --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-sdl2_mixer switch-lua52

      - name: Compile and Build NRO
        run: |
          make

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingjie4-nro-build
          path: yingjie4.nro
