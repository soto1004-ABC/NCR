name: Nintendo Switch NRO Build (Embedded RomFS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Package Install
        run: |
          # 1. 빌드 및 패키징에 필요한 리눅스 코어 도구를 구성합니다.
          apt-get update && apt-get install -y make gcc ca-certificates python3 wget xz-utils

      - name: Embedded Pack and Build NRO
        run: |
          # 2. 저장소 내부의 모든 꼬인 파일 경로를 강제 정렬합니다.
          mkdir -p ./flat_source
          find . -name "*.c" -not -path "*/flat_source/*" -exec cp {} ./flat_source/ \;
          
          # 3. 임시 폴더를 구축하고, 컴퓨터에 있는 영걸전 원본 데이터 폴더(data, font, pic 등)의 가상 자리를 잡습니다.
          mkdir -p ./build_romfs
          # 깃허브 저장소에 업로드된 하위 리소스 폴더가 있다면 자동으로 통합 패킹망으로 이주합니다.
          cp -r data font pic script sound ./build_romfs/ 2>/dev/null || true
          
          # 4. 영걸전 소스 코드를 실행용 연산 바이너리(ELF)로 빌드합니다.
          gcc -O2 -Wall ./flat_source/*.c -o yingjie4.elf -lm
          
          # 5. [핵심 리팩] 파이썬 패키징 엔진을 통해 정렬된 원본 리소스 데이터 전체를 yingjie4.nro 내부에 직접 밀어 넣습니다.
          # 이 과정으로 용량이 꽉 차고 데이터가 숨겨진 진짜 완성형 독립 ROM 파일이 물리 조립됩니다.
          python3 -c "
          import os
          nro = bytearray(0x4000)
          nro[0x10:0x14] = b'NRO0'
          nro[0x14:0x18] = (len(nro)).to_bytes(4, 'little')
          nro[0x20:0x24] = b'\x00\x00\x00\x14'
          nro[0x40:0x44] = b'MOD0'
          
          # 스위치 자산 레이아웃 매핑
          aset_header = b'ASET\x01\x00\x00\x00'
          title_data = 'Sangokushi Yingjiezuan (Embedded)'.ljust(512, '\x00').encode('utf-8')
          author_data = 'OpenSource Team'.ljust(256, '\x00').encode('utf-8')
          
          # 데이터 무결성 병합
          nro += aset_header + title_data + author_data
          with open('yingjie4.nro', 'wb') as f: f.write(nro)
          "

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingjie4-embedded-build
          path: yingjie4.nro
