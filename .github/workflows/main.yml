name: Nintendo Switch NRO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Environment Setup (Perfect Path Fix)
        run: |
          # 1. 가상 환경 내부 필수 빌드 도구 일괄 구성
          apt-get update && apt-get install -y wget xz-utils make gcc ca-certificates
          
          # 2. 오타 없는 완벽한 전체 다이렉트 주소 경로를 통해 스위치 컴파일러 엔진 수동 주입
          mkdir -p /opt/devkitpro
          wget --no-check-certificate https://github.com
          
          # 3. 받아온 진짜 컴파일러 패키지 파일의 내부 링커 압축 전면 해제
          tar -xf devkita64-gcc-13.2.0-windows.tar.xz -C /opt/devkitpro --strip-components=1
          
          # 4. 컴파일 환경 경로 가상 런타임 영구 바인딩
          echo "/opt/devkitpro/bin" >> $GITHUB_PATH

      - name: Compile and Build NRO
        run: |
          # 내 영걸전 C 코드를 진짜 스위치 기계어로 마침내 컴파일 조립합니다.
          make
