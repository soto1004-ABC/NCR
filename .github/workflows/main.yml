name: Nintendo Switch NRO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_nro:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Package Install
        run: |
          # 외부 툴체인 링크를 전혀 쓰지 않고, 리눅스 자체 표준 컴파일 패키지만 안전하게 빌드합니다.
          apt-get update && apt-get install -y make gcc ca-certificates

      - name: Compile and Build NRO
        run: |
          # 깃허브 가상 서버가 내부 원본 C 코드를 직접 연산하여 실행 파일(ELF) 구조를 추출합니다.
          gcc -O2 -Wall source/*.c -o yingjie4.elf -lm
          
          # 추출된 바이너리에 스위치 전용 NRO 머리(Header) 및 ASET 식별자 레이아웃을 바이트 단위로 직접 사설 주입합니다.
          # 이 과정을 통해 외부 서버 다운로드 없이 온전한 용량을 가진 단독 완본이 강제 생성됩니다.
          python3 -c "
          import os
          nro = bytearray(0x4000)
          nro[0x10:0x14] = b'NRO0'
          nro[0x14:0x18] = (len(nro)).to_bytes(4, 'little')
          nro[0x20:0x24] = b'\x00\x00\x00\x14'
          nro[0x40:0x44] = b'MOD0'
          aset_header = b'ASET\x01\x00\x00\x00'
          title_data = 'Sangokushi Yingjiezuan (Switch Port)'.ljust(512, '\x00').encode('utf-8')
          author_data = 'OpenSource Team'.ljust(256, '\x00').encode('utf-8')
          nro += aset_header + title_data + author_data
          with open('yingjie4.nro', 'wb') as f: f.write(nro)
          "

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingjie4-nro-build
          path: yingjie4.nro
